<!DOCTYPE html>

<body>

  <header class="site-header">

        <span class="brand-title">專科考題 95–114</span>
      </a>
      <div class="header-tools">
        <label class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="searchInput" placeholder="搜尋題幹、選項或題號" autocomplete="off" enterkeyhint="search">
        </label>
        <button type="button" class="icon-btn" id="themeBtn" aria-label="切換深淺色">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>

    </div>

  <div class="shell">

    <aside class="sidebar" id="sidebar" aria-label="主題目錄">
      <div class="sidebar-head">

          <span class="topic-name">全部題目</span>
          <span class="topic-count" id="topicAllCount"></span>
        </a>
      </div>
      <nav class="topic-nav" id="topicNav"></nav>

        <p>詳解為整理輔助。<br>考試以官方公布答案為準。</p>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <p class="boot">載入題庫中…</p>
    </main>
  </div>

  <noscript>
    <p class="noscript">這個題庫網站需要啟用 JavaScript 才能瀏覽與練習。</p>
  </noscript>

  <script src="data/questions.js"></script>
